name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DISPLAY_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DISPLAY_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DISPLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DISPLAY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/display.jks"
          {
            echo "storeFile=$RUNNER_TEMP/display.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - run: chmod +x gradlew
      - run: ./gradlew lintRelease testReleaseUnitTest assembleRelease --stacktrace
      - name: Prepare assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "display-${GITHUB_REF_NAME#v}-armv7.apk"
          sha256sum "display-${GITHUB_REF_NAME#v}-armv7.apk" > "display-${GITHUB_REF_NAME#v}-armv7.apk.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            display-*-armv7.apk
            display-*-armv7.apk.sha256
